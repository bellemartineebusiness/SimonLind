<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none" aria-label="Molnbaserade tjänster med noder – dekorativ ikon">
  <defs>
    <linearGradient id="cloudFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cloud body with drop shadow -->
  <g filter="url(#shadow)">
    <!-- Base -->
    <rect x="20" y="72" width="160" height="58" rx="29" fill="url(#cloudFill)"/>
    <!-- Left bump -->
    <circle cx="52" cy="72" r="28" fill="url(#cloudFill)"/>
    <!-- Center bump (tallest) -->
    <circle cx="100" cy="54" r="36" fill="url(#cloudFill)"/>
    <!-- Right bump -->
    <circle cx="148" cy="70" r="26" fill="url(#cloudFill)"/>
  </g>

  <!-- Highlight on top of cloud -->
  <ellipse cx="100" cy="56" rx="22" ry="12" fill="white" opacity="0.18"/>

  <!-- Network nodes -->
  <!-- Node positions -->
  <!-- Center: 100,90  Left: 66,98  Right: 134,98  Bottom-left: 78,116  Bottom-right: 122,116 -->

  <!-- Connection lines (drawn first, behind nodes) -->
  <line x1="100" y1="90" x2="66" y2="98" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="100" y1="90" x2="134" y2="98" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="66" y1="98" x2="78" y2="116" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="134" y1="98" x2="122" y2="116" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="78" y1="116" x2="122" y2="116" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="100" y1="90" x2="78" y2="116" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="100" y1="90" x2="122" y2="116" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Node circles (outer ring white, inner filled) -->
  <circle cx="100" cy="90" r="8" fill="white" opacity="0.95"/>
  <circle cx="100" cy="90" r="5" fill="#6366f1"/>

  <circle cx="66" cy="98" r="7" fill="white" opacity="0.95"/>
  <circle cx="66" cy="98" r="4" fill="#8b5cf6"/>

  <circle cx="134" cy="98" r="7" fill="white" opacity="0.95"/>
  <circle cx="134" cy="98" r="4" fill="#8b5cf6"/>

  <circle cx="78" cy="116" r="7" fill="white" opacity="0.95"/>
  <circle cx="78" cy="116" r="4" fill="#a855f7"/>

  <circle cx="122" cy="116" r="7" fill="white" opacity="0.95"/>
  <circle cx="122" cy="116" r="4" fill="#a855f7"/>
</svg>
